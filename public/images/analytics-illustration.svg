<svg width="500" height="400" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Analytics Dashboard Illustration -->
  <defs>
    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0080ff;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Dashboard Background -->
  <rect x="50" y="50" width="400" height="300" rx="15" fill="#0a2540" opacity="0.9"/>
  <rect x="50" y="50" width="400" height="50" rx="15" fill="#1a3a5c" opacity="0.8"/>
  
  <!-- Chart Bars -->
  <rect x="100" y="200" width="40" height="100" fill="url(#chartGradient)" rx="5">
    <animate attributeName="height" values="100;120;100" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="160" y="180" width="40" height="120" fill="url(#chartGradient)" rx="5">
    <animate attributeName="height" values="120;140;120" dur="2s" begin="0.3s" repeatCount="indefinite"/>
  </rect>
  <rect x="220" y="160" width="40" height="140" fill="url(#chartGradient)" rx="5">
    <animate attributeName="height" values="140;160;140" dur="2s" begin="0.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="280" y="190" width="40" height="110" fill="url(#chartGradient)" rx="5">
    <animate attributeName="height" values="110;130;110" dur="2s" begin="0.9s" repeatCount="indefinite"/>
  </rect>
  <rect x="340" y="170" width="40" height="130" fill="url(#chartGradient)" rx="5">
    <animate attributeName="height" values="130;150;130" dur="2s" begin="1.2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Trend Line -->
  <polyline points="120,250 180,230 240,200 300,220 360,190" stroke="#ff3b30" stroke-width="3" fill="none" opacity="0.8"/>
  
  <!-- Data Points -->
  <circle cx="120" cy="250" r="6" fill="#ff3b30"/>
  <circle cx="180" cy="230" r="6" fill="#ff3b30"/>
  <circle cx="240" cy="200" r="6" fill="#ff3b30"/>
  <circle cx="300" cy="220" r="6" fill="#ff3b30"/>
  <circle cx="360" cy="190" r="6" fill="#ff3b30"/>
  
  <!-- Stats Cards -->
  <rect x="70" y="70" width="80" height="40" rx="8" fill="#00d4aa" opacity="0.2"/>
  <rect x="170" y="70" width="80" height="40" rx="8" fill="#0080ff" opacity="0.2"/>
  <rect x="270" y="70" width="80" height="40" rx="8" fill="#ff3b30" opacity="0.2"/>
</svg>
