<svg width="500" height="400" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- AI/ML Illustration -->
  <defs>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff3b30;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#ff6b35;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Neural Network -->
  <g opacity="0.8">
    <!-- Input Layer -->
    <circle cx="100" cy="150" r="12" fill="#00d4aa"/>
    <circle cx="100" cy="200" r="12" fill="#00d4aa"/>
    <circle cx="100" cy="250" r="12" fill="#00d4aa"/>
    
    <!-- Hidden Layer 1 -->
    <circle cx="200" cy="130" r="12" fill="#0080ff"/>
    <circle cx="200" cy="180" r="12" fill="#0080ff"/>
    <circle cx="200" cy="230" r="12" fill="#0080ff"/>
    <circle cx="200" cy="280" r="12" fill="#0080ff"/>
    
    <!-- Hidden Layer 2 -->
    <circle cx="300" cy="150" r="12" fill="#ff6b35"/>
    <circle cx="300" cy="200" r="12" fill="#ff6b35"/>
    <circle cx="300" cy="250" r="12" fill="#ff6b35"/>
    
    <!-- Output Layer -->
    <circle cx="400" cy="200" r="12" fill="#ff3b30"/>
    
    <!-- Connections -->
    <line x1="100" y1="150" x2="200" y2="130" stroke="url(#aiGradient)" stroke-width="1" opacity="0.4"/>
    <line x1="100" y1="150" x2="200" y2="180" stroke="url(#aiGradient)" stroke-width="1" opacity="0.4"/>
    <line x1="100" y1="200" x2="200" y2="180" stroke="url(#aiGradient)" stroke-width="1" opacity="0.4"/>
    <line x1="100" y1="200" x2="200" y2="230" stroke="url(#aiGradient)" stroke-width="1" opacity="0.4"/>
    <line x1="100" y1="250" x2="200" y2="230" stroke="url(#aiGradient)" stroke-width="1" opacity="0.4"/>
    <line x1="100" y1="250" x2="200" y2="280" stroke="url(#aiGradient)" stroke-width="1" opacity="0.4"/>
    
    <line x1="200" y1="130" x2="300" y2="150" stroke="url(#aiGradient)" stroke-width="1" opacity="0.4"/>
    <line x1="200" y1="180" x2="300" y2="200" stroke="url(#aiGradient)" stroke-width="1" opacity="0.4"/>
    <line x1="200" y1="230" x2="300" y2="250" stroke="url(#aiGradient)" stroke-width="1" opacity="0.4"/>
    
    <line x1="300" y1="150" x2="400" y2="200" stroke="url(#aiGradient)" stroke-width="2" opacity="0.6"/>
    <line x1="300" y1="200" x2="400" y2="200" stroke="url(#aiGradient)" stroke-width="2" opacity="0.6"/>
    <line x1="300" y1="250" x2="400" y2="200" stroke="url(#aiGradient)" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Pulse Effect -->
  <circle cx="400" cy="200" r="20" fill="none" stroke="#ff3b30" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="20;40;20" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
