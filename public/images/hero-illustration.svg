<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern Fishery Illustration -->
  <defs>
    <linearGradient id="oceanGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0080ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="boatGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff3b30;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Ocean Waves -->
  <path d="M0 300 Q150 250 300 300 T600 300 L600 600 L0 600 Z" fill="url(#oceanGradient)" opacity="0.3"/>
  <path d="M0 350 Q150 320 300 350 T600 350 L600 600 L0 600 Z" fill="url(#oceanGradient)" opacity="0.2"/>
  
  <!-- Fishing Boat -->
  <g transform="translate(200, 250)">
    <path d="M50 50 L150 50 L170 80 L30 80 Z" fill="url(#boatGradient)"/>
    <rect x="80" y="20" width="40" height="30" fill="#0a2540" rx="5"/>
    <circle cx="100" cy="35" r="8" fill="#00d4aa" opacity="0.8"/>
  </g>
  
  <!-- Fish Icons -->
  <g opacity="0.6">
    <ellipse cx="150" cy="400" rx="20" ry="10" fill="#00d4aa" transform="rotate(-20 150 400)"/>
    <ellipse cx="400" cy="420" rx="25" ry="12" fill="#0080ff" transform="rotate(15 400 420)"/>
    <ellipse cx="300" cy="450" rx="18" ry="9" fill="#00d4aa" transform="rotate(-10 300 450)"/>
  </g>
  
  <!-- Data Points -->
  <circle cx="250" cy="200" r="8" fill="#ff3b30" opacity="0.8">
    <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="180" r="8" fill="#ff3b30" opacity="0.8">
    <animate attributeName="r" values="8;12;8" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="220" r="8" fill="#ff3b30" opacity="0.8">
    <animate attributeName="r" values="8;12;8" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Connection Lines -->
  <line x1="250" y1="200" x2="350" y2="180" stroke="#00d4aa" stroke-width="2" opacity="0.4" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="350" y1="180" x2="300" y2="220" stroke="#00d4aa" stroke-width="2" opacity="0.4" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
  </line>
</svg>
