version: '3.9'
services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports: ['3001:3001']
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
    volumes:
      - ./backend/logs:/app/logs
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports: ['6379:6379']
    volumes:
      - redis_data:/data

volumes:
  redis_data:
